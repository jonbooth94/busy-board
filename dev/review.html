<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art review (dev only)</title>
  <style>
    html, body { overflow: auto !important; height: auto !important; touch-action: auto !important; user-select: text !important; }
    body { font-family: system-ui, sans-serif; margin: 24px !important; background: #f3f3f3 !important; }
    h1 { margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
    figure { margin: 0; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 4px #0002; }
    figure .cell { position: relative; aspect-ratio: 1; }
    figcaption { font-size: 20px; font-weight: 600; text-align: center; margin-top: 8px; }
    .states { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
    .states button { padding: 6px 10px; border-radius: 8px; background: #efe1c7; font: 14px system-ui; cursor: pointer; }
    .icons { display: flex; gap: 32px; align-items: end; margin: 16px 0 28px; }
    .icons div { text-align: center; font-size: 13px; color: #555; }
    .icons img { display: block; margin: 0 auto 6px; }
    .square { border-radius: 22%; }
  </style>
</head>
<body>
  <h1>Busy Board: art review</h1>
  <p>App icon at home-screen sizes, then every object large. The buttons show each pose and play its animation (no sound).</p>
  <div class="icons" id="icons"></div>
  <div class="grid" id="grid"></div>
  <script type="module" src="./review.ts"></script>
</body>
</html>
